# Gitea 质量闸门适配层（复制到目标仓库：.gitea/workflows/verify.yml）
# Gitea Actions 与 GitHub Actions 语法兼容，内容与 verify-github.yml 相同
# 任务名必须为 verify——受保护分支的"状态检查"按此名字引用
name: verify
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify.sh
